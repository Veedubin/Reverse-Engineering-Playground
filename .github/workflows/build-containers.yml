name: build-containers

# Build and push the 5 RE_Playground images to GitHub Container Registry.
# Triggered when a v* tag is pushed (e.g. v0.2.0). Login uses the GHCR token
# (built-in) so no secrets need to be configured.
#
# Tags pushed:
#   ghcr.io/veedubin/reverse-engineering-playground/re-core:0.2.0
#   ghcr.io/veedubin/reverse-engineering-playground/re-ghidra:0.2.0
#   ... (5 services total)
#   ghcr.io/veedubin/reverse-engineering-playground/re-core:0.2  (minor alias)
#   ghcr.io/veedubin/reverse-engineering-playground/re-core:latest

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: re-core
            dockerfile: docker/core/Dockerfile
          - name: re-ghidra
            dockerfile: docker/ghidra/Dockerfile
          - name: re-radare2
            dockerfile: docker/radare2/Dockerfile
          - name: re-filebrowser
            dockerfile: docker/filebrowser/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # strip leading 'v'
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=${VERSION%.*}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/veedubin/reverse-engineering-playground/${{ matrix.service.name }}:${{ steps.version.outputs.version }}
            ghcr.io/veedubin/reverse-engineering-playground/${{ matrix.service.name }}:${{ steps.version.outputs.major_minor }}
            ghcr.io/veedubin/reverse-engineering-playground/${{ matrix.service.name }}:latest
          labels: |
            org.opencontainers.image.title=RE_Playground ${{ matrix.service.name }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
