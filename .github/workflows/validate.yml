name: validate

# Fast, cheap checks on every push and PR. Catches 90% of "I forgot to
# validate the YAML" mistakes. Total runtime: ~30 seconds on a fresh
# ubuntu-latest runner.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  lint:
    name: Validate config + scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validators
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml ruff

      - name: Validate opencode.json
        run: |
          python -c "
          import json, sys
          with open('.opencode/opencode.json') as f:
              cfg = json.load(f)
          assert 'mcp' in cfg, 'opencode.json must have an mcp section'
          assert 'provider' in cfg, 'opencode.json must have a provider section'
          print(f'opencode.json OK: {len(cfg.get(\"mcp\", {}))} MCP servers, {len(cfg.get(\"provider\", {}))} provider(s)')
          "

      - name: Validate docker-compose.yml
        run: |
          python -c "
          import yaml, sys
          with open('docker-compose.yml') as f:
              doc = yaml.safe_load(f)
          assert 'services' in doc, 'docker-compose.yml must have a services key'
          assert 'networks' in doc, 'docker-compose.yml must declare a network'
          assert 'volumes' in doc, 'docker-compose.yml must declare named volumes'
          print(f'docker-compose.yml OK: {len(doc[\"services\"])} services, {len(doc[\"volumes\"])} volumes')
          "

      - name: Validate podman-compose.yml
        run: |
          python -c "
          import yaml, sys
          with open('podman-compose.yml') as f:
              doc = yaml.safe_load(f)
          assert 'services' in doc, 'podman-compose.yml must have a services key'
          print(f'podman-compose.yml OK: {len(doc[\"services\"])} services')
          "

      - name: Validate install.py syntax + self-check
        run: |
          python -m py_compile install.py && echo "install.py compiles OK"
          python install.py --list 2>&1 | head -40

      - name: Ruff lint install.py
        run: |
          ruff check install.py || (echo "::warning::ruff found issues in install.py" && exit 0)

      - name: Check for hardcoded secrets
        run: |
          # Catches the kind of leak that prompted the v0.1.0 cleanup.
          # If you genuinely need to add a token-shaped literal, escape it
          # in a way these regexes miss (e.g. split with comments).
          if grep -rEn "github_pat_[A-Za-z0-9_]{20,}|gho_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{20,}" \
              . --include="*.py" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.md" --include="*.sh" --include="Dockerfile" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv 2>/dev/null; then
            echo "::error::Hardcoded secret pattern detected. Use {env:...} placeholders."
            exit 1
          else
            echo "No hardcoded secret patterns found."
          fi

      - name: Check for hardcoded user paths
        run: |
          # Exclude .github/ because the regex itself lives there (and the
          # CHANGELOG.md mentions the path we're scanning for). Excluding
          # those two paths from the scan keeps the scanner honest.
          HITS=$(grep -rEn "/home/jcharles|/Users/jcharles" \
              . \
              --include="*.py" --include="*.json" --include="*.yml" --include="*.yaml" --include="*.md" --include="*.sh" --include="Dockerfile" \
              --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.github 2>/dev/null \
            | grep -v "CHANGELOG.md" || true)
          if [ -n "$HITS" ]; then
            echo "::error::Hardcoded /home/jcharles path detected:"
            echo "$HITS"
            exit 1
          else
            echo "No hardcoded user paths."
          fi

      - name: Validate agent PERSONA markers
        run: |
          python -c "
          import os, re, sys
          agents_dir = '.opencode/agents'
          if not os.path.isdir(agents_dir):
              print('No .opencode/agents directory — skipping')
              sys.exit(0)
          missing = []
          for f in sorted(os.listdir(agents_dir)):
              if not f.endswith('.md'):
                  continue
              path = os.path.join(agents_dir, f)
              with open(path) as fh:
                  content = fh.read()
              if '## Persona' not in content or 'PERSONA-MARKER' not in content:
                  missing.append(f)
          if missing:
              print(f'::error::Agents missing ## Persona / PERSONA-MARKER: {missing}')
              sys.exit(1)
          print(f'All {len([f for f in os.listdir(agents_dir) if f.endswith(\".md\")])} agents have persona markers.')
          "
